<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>켤레복소수</title>
  <!-- MathJax 로드는 그대로 두어도 되지만, 현재 모든 \(), \dfrac{}{}, \sqrt{} 등을 제거했으므로
       사실상 수식 렌더링은 하지 않습니다. 필요하면 유지, 아니면 제거해도 됩니다. -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0; 
      padding: 0; 
      background: #f0f0f0;
    }
    .container {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      box-sizing: border-box;
      margin-top: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2, h3 {
      text-align: center;
    }
    .energy-bar {
      width: 100%;
      height: 20px;
      background-color: #ccc;
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
      position: relative;
    }
    .energy-inner {
      height: 100%;
      background-color: #4caf50;
      width: 100%;
      transition: width 0.2s linear;
    }
    .center {
      text-align: center;
    }
    .difficulty-btn {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
    .answer-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fafafa;
      cursor: pointer;
    }
    .answer-btn:hover {
      background: #eee;
    }
    .result {
      text-align: center;
      margin-top: 20px;
    }
    #response {
      white-space: pre-wrap;
      background: #f9f9f9;
      border: 1px solid #ccc;
      margin-top: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>
<div class="container" id="startContainer">
  <h1>켤레복소수</h1>
  <div style="text-align:center;">
    <label for="playerName">이름: </label>
    <input type="text" id="playerName" style="text-align:center;">
  </div>
  <h3>난이도를 선택하세요</h3>
  <div class="center">
    <button class="difficulty-btn" onclick="startGame('최상')">최상 (20초 / 문제, +20점)</button>
    <button class="difficulty-btn" onclick="startGame('상')">상 (30초 / 문제, +15점)</button>
    <button class="difficulty-btn" onclick="startGame('중')">중 (40초 / 문제, +13점)</button>
    <button class="difficulty-btn" onclick="startGame('하')">하 (무제한, +10점)</button>
  </div>
</div>

<div class="container hidden" id="quizContainer">
  <div class="energy-bar">
    <div class="energy-inner" id="energyBar"></div>
  </div>
  <div id="infoArea">
    <div>남은 기회: <span id="lives">3</span></div>
    <div>현재 점수: <span id="score">0</span></div>
    <div>경과 시간: <span id="elapsed">0</span>초</div>
  </div>
  <hr>
  <div id="questionArea"></div>
  <div id="answersArea"></div>
</div>

<div class="container hidden" id="endContainer">
  <h2 id="endTitle">게임 종료</h2>
  <div class="result">
    최종 점수: <span id="finalScore">0</span><br>
    총 소요 시간: <span id="finalTime">0</span>초
    <div>
      <button onclick="sendScore()">점수 전송</button>
    </div>
    <div id="response"></div>
  </div>
</div>

<script>
  // 1) 원래는 MathJax.typeset() 등을 사용했으나,
  //    지금은 \() 등의 LaTeX 표기가 모두 제거되어 일반 텍스트 상태입니다.
  function renderMath() {
    // 수식 렌더링 함수. 현재 사용 여부는 선택 가능.
    MathJax.typeset();
  }

  let timePerQuestion = 40; 
  let pointsPerQuestion = 10; 
  let difficulty = '';

  function startGame(selectedDifficulty) {
    const nameInput = document.getElementById('playerName');
    if(!nameInput.value) {
      alert('이름을 입력하세요!');
      return;
    }
    playerName = nameInput.value;

    difficulty = selectedDifficulty;
    if(difficulty === '최상') {
      timePerQuestion = 20;
      pointsPerQuestion = 20;
    } else if(difficulty === '상') {
      timePerQuestion = 30;
      pointsPerQuestion = 15;
    } else if(difficulty === '중') {
      timePerQuestion = 40;
      pointsPerQuestion = 13;
    } else {
      timePerQuestion = Infinity;
      pointsPerQuestion = 10;
    }

    document.getElementById('startContainer').classList.add('hidden');
    document.getElementById('quizContainer').classList.remove('hidden');
    
    initGame();
  }

  // 모든 문제: LaTeX 슬래시 제거 후 일반 괄호만 남긴 상태
  const questionData = [
    // 문제 1~9
    {
      q: "(3 + 2i) 의 켤레복소수를 구하여라.",

        "(3 + 2i)",

        "(-3 - 2i)",
        "(2 - 3i)"
      ],
      correct: 1
    },
    {

        "(1 - 4i)",

        "(-1 + 4i)",
        "(-1 - 4i)"
      ],
      correct: 1
    },
    {
      q: "(-8) 의 켤레복소수를 구하여라.",

        "(-8 + i)",

        "(-8i)"
      ],
      correct: 2
    },
    {
      q: "(15i) 의 켤레복소수를 구하여라.",

        "(-15)",

        "(15)",
        "(15 + i)"
      ],
      correct: 1
    },
    {
      q: "(3 - 4i) 의 켤레복소수를 구하여라.",
      choices: [
        "(3 - 4i)",
        "(-3 + 4i)",
        "(-3 - 4i)",
        "(3 + 4i)"
      ],

    },
    {
      q: "(i - 7) 의 켤레복소수를 구하여라.",

        "(i + 7)",
        "(-1 - 7i)"
      ],
      correct: 0
    },
    {

        "(-1 + 2i)",

        "(-1 - 2i)",
        "(1 - 2i)"
      ],
      correct: 2
    },
    {
      q: "(2 - i) 의 켤레복소수를 구하여라.",

        "(-2 + i)",
        "(2 - 2i)"
      ],
      correct: 0
    },
    {

        "(-i)",

        "(-i + 1)"
      ],

    },

    // 문제 13~20
    {
      q: "(-3i + 2) 의 켤레복소수를 구하여라.",

    {

        "(√5 - √3 i)",
        "(-√5 - √3 i)",

    {

        "(-(1 + √2) i)",

        "(-(1 - √2) i)"
      ],
      correct: 0
    },

    // 문제 21~30
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (1)",
      choices: [
        "(0)",
        "(1)",
        "(-1)",
        "(i)"
      ],
      correct: 1
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (3 - 2i)",
      choices: [
        "(3 - 2i)",
        "(3 + 2i)",
        "(-3 + 2i)",
        "(2 - 3i)"
      ],
      correct: 1
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (2 + 3i)",
      choices: [
        "(2 + 3i)",
        "(3 + 2i)",
        "(-2 - 3i)",
        "(2 - 3i)"
      ],
      correct: 3
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (2i)",
      choices: [
        "(2 + i)",
        "(-2i)",
        "(2 - i)",
        "(-2)"
      ],
      correct: 1
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (-4i)",
      choices: [
        "(4i)",

        "(-i)"
      ],
      correct: 0
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (7 + i)",
      choices: [
        "(6 + i)",
        "(7 + i)",
        "(7 - i)",
        "(-7 - i)"
      ],
      correct: 2
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (3 + 8i)",
      choices: [
        "(3 - 8i)",
        "(-3 + 8i)",
        "(3 + 8i)",
        "(8 - 3i)"
      ],
      correct: 0
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (-2 + 3i)",
      choices: [

        "(2 + 3i)",
        "(-2 + 3i)",
        "(-3 + 2i)"
      ],
      correct: 0
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (√3 i - 8)",
      choices: [
        "(-√3 i + 8)",
        "(-√3 i - 8)",
        "(√3 - 8i)",
        "(√3 i - 8)"
      ],
      correct: 1
    },
    {
      q: "다음 복소수의 켤레복소수를 구하여라: (i + 9)",
      choices: [
        "(-i + 9)",
        "(9 - i)",
        "(-i + 8)",
        "(i - 9)"
      ],
      correct: 0
    },

    // 문제 36~44
    {
      q: "(2i z + z̄ = 2 + i) 를 만족할 때, z를 구하라.",
      choices: [
        "(i)",
        "(1 - 2i)",
        "(-i)",
        "(1)"
      ],
      correct: 0
    },
    {
      q: "(3i z + 2 z̄ = 8 + 7i) 를 만족할 때, z를 구하라.",
      choices: [
        "(i)",
        "(1 - 2i)",
        "(1 + 2i)",
        "(-1 + 2i)"
      ],
      correct: 1
    },
    {
      q: "(i z + 3 z̄ = 8 + 2i) 를 만족할 때, z를 구하라.",
      choices: [
        "((11/4) - (1/4)i)",
        "(3 - i)",
        "((11/4) + (1/4)i)",
        "(1 + i)"
      ],
      correct: 2
    },
    {
      q: "(2z + 3z̄ = 3 + 7i) 를 만족할 때, z를 구하라.",
      choices: [
        "(3 - i)",

        "(-3 + i)"

      correct: 0
    },

    },

        "(3 + 3i)",

        "(3 + i)"
      ],
      correct: 1
    },
    {
      q: "((2 + i)z + i z̄ = 8i) 를 만족할 때, z를 구하라.",
      choices: [
        "(-4i)",
        "(4i)",
        "(2 + 4i)",
        "(2 - 4i)"
      ],
      correct: 1
    },
    {
      q: "((1 + i)z + i z̄ = 1 + 3i) 를 만족할 때, z를 구하라.",
      choices: [
        "(1 - i)",
        "(-1 + i)",
        "(1 + i)",
        "(2 + i)"
      ],
      correct: 2
    },
    {
      q: "(z̄ + (2 - i)z = -3 + 5i) 를 만족할 때, z를 구하라.",
      choices: [
        "(-2 + 3i)",
        "(-2 - 3i)",
        "(2 + 3i)",
        "(3 - 2i)"
      ],
      correct: 0
    },

    // 문제 64~70
    {
      q: "((x + y) + (x - y)i = 2 + 4i) 를 만족하는 실수 x, y를 구하라.",
      choices: [
        "x = -1, y = 3",
        "x = 0, y = -3",
        "x = -1, y = -3",
        "x = 2, y = 1"
      ],
      correct: 0
    },
    {
      q: "((3 + 2i)x + (2 - i)y = 5 - i) 를 만족하는 실수 x, y를 구하라.",
      choices: [
        "x = 2, y = -1",
        "x = 1, y = 1",
        "x = 0, y = 1",
        "x = 1, y = -2"
      ],
      correct: 1
    },
    {
      q: "(x(2 + i) + y(1 + 3i) = 7i) 를 만족하는 실수 x, y를 구하라.",
      choices: [

        "x = 1, y = -2",
        "x = -1, y = 2",
        "x = 2, y = -1"
      ],
      correct: 1
    },
    {
      q: "((x + 1) + (y - 3)i = 2 + 2i) 를 만족하는 실수 x, y를 구하라.",
      choices: [
        "x = 1, y = -3",
        "x = 1, y = 1",
        "x = -1, y = 1",

      ],
      correct: 1
    },
    {

        "x = 1, y = 4",

        "x = -1, y = 4"

      ],

    },

      q: "(x + yi)̄ = 3 + (x + 2y)i (단, (x + yi)̄ = x - yi) 를 만족하는 실수 x, y를 구하라.",

        "x = 3, y = -1",
        "x = -1, y = 3",
        "x = 3, y = 1",
        "x = 2, y = -3"
      ],

    // 문제 72~80
    {
      q: "((a+b) - (a-b)i = 5 + 7i) 를 만족하는 실수 a, b에 대하여 ab의 값을 구하여라.",

        "(2)",

    {

    {

      choices: [
        "36",
        "37",
        "16",
        "49"
      ],
      correct: 1
    },

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  // 문제 순서 섞기
  shuffleArray(questionData);

  // 보기 순서 섞되, correct 인덱스 조정
  questionData.forEach(qObj => {
    const choiceArr = qObj.choices.map((c, idx) => ({ text: c, index: idx }));
    shuffleArray(choiceArr);
    const newCorrectIndex = choiceArr.findIndex(obj => obj.index === qObj.correct);
    qObj.choices = choiceArr.map(obj => obj.text);
    qObj.correct = newCorrectIndex;
  });

  let currentIndex = 0;
  let score = 0;
  let lives = 3;
  let elapsed = 0; 
  let timer = null;
  let widthInterval = null;
  let playerName = "";

  function initGame() {
    currentIndex = 0;
    score = 0;
    lives = 3;
    elapsed = 0;

    document.getElementById('lives').textContent = lives;
    document.getElementById('score').textContent = score;
    document.getElementById('elapsed').textContent = elapsed;

    nextQuestion();
    startGlobalTimer();
  }

  function startGlobalTimer() {
    setInterval(() => {
      elapsed++;
      document.getElementById('elapsed').textContent = elapsed;
    }, 1000);
  }

  function nextQuestion() {
    if (currentIndex >= questionData.length) {
      endGame("모든 문제를 풀었습니다!");
      return;
    }
    const qObj = questionData[currentIndex];
    document.getElementById('questionArea').innerHTML = `
      <div>${qObj.q}</div>
    `;

    const answersArea = document.getElementById('answersArea');
    answersArea.innerHTML = "";

    qObj.choices.forEach((choiceText, idx) => {
      const btn = document.createElement('button');
      btn.className = "answer-btn";
      btn.innerHTML = choiceText;
      btn.onclick = () => checkAnswer(idx);
      answersArea.appendChild(btn);
    });

    initEnergyBar();
  }

  function initEnergyBar() {
    clearInterval(timer);
    clearInterval(widthInterval);

    const bar = document.getElementById('energyBar');
    bar.style.width = "100%";

    let timeLeft = timePerQuestion;
    if (timeLeft === Infinity) {
      return;
    }

    timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        timeUp();
      }
    }, 1000);

    let percent = 100;
    const step = 100 / timePerQuestion;
    widthInterval = setInterval(() => {
      percent -= step;
      if (percent < 0) percent = 0;
      bar.style.width = percent + "%";
      if (percent <= 0) {
        clearInterval(widthInterval);
      }
    }, 1000);
  }

  function timeUp() {
    clearInterval(timer);
    clearInterval(widthInterval);
    lives--;
    document.getElementById('lives').textContent = lives;
    alert("시간이 초과되었습니다! (오답 처리)");
    showCorrectAnswer();
    if (lives <= 0) {
      endGame("기회를 모두 소진했습니다!");
    } else {
      currentIndex++;
      nextQuestion();
    }
  }

  function checkAnswer(selectedIndex) {
    clearInterval(timer);
    clearInterval(widthInterval);

    const qObj = questionData[currentIndex];
    if (selectedIndex === qObj.correct) {
      score += pointsPerQuestion;
      document.getElementById('score').textContent = score;
      alert("정답입니다!");
    } else {
      lives--;
      document.getElementById('lives').textContent = lives;
      alert("틀렸습니다! 정답: " + qObj.choices[qObj.correct]);
      if (lives <= 0) {
        endGame("기회를 모두 소진했습니다!");
        return;
      }
    }

    currentIndex++;
    if (currentIndex < questionData.length) {
      nextQuestion();
    } else {
      endGame("모든 문제를 풀었습니다!");
    }
  }

  function showCorrectAnswer() {
    const qObj = questionData[currentIndex];
    alert("정답: " + qObj.choices[qObj.correct]);
  }

  function endGame(msg) {
    document.getElementById('quizContainer').classList.add('hidden');
    document.getElementById('endContainer').classList.remove('hidden');
    document.getElementById('endTitle').textContent = msg;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalTime').textContent = elapsed;
  }

  // 점수 전송
  function sendScore() {
    saveData("켤레복소수", playerName, score, elapsed);
  }

  // 서버 전송
  async function saveData(game, name, score, elapsedTime) {
    const FUNCTION_URL = "https://us-central1-record-f420d.cloudfunctions.net/report";

    const requestData = {
      game,
      name,
      score: parseInt(score, 10),
      elapsedTime: parseInt(elapsedTime, 10)
    };

    try {
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestData)
      });

      const responseData = await response.json();

      if (response.ok) {
        document.getElementById('response').innerText = 
          `성공: ${JSON.stringify(responseData, null, 2)}`;
      } else {
        document.getElementById('response').innerText = 
          `오류: ${JSON.stringify(responseData, null, 2)}`;
      }
    } catch (error) {
      console.error('요청 실패:', error);
      document.getElementById('response').innerText = 
          `네트워크 오류: ${error.message}`;
    }
  }
</script>

</html>
